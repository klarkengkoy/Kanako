name: Kanako manual Android debug build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanako-manual-debug
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37"
      - name: Build debug APK and execute unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kanako-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
